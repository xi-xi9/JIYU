<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIYU</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="潮聲未寄">
  <meta property="og:image" content="https://github.com/user-attachments/assets/d6a6a68a-ab87-4eed-b501-c9cc96770b09">
  <meta property="og:image:type" content="image/png">
</head>
<style>
  :root{
    --bg-deep:#D2E9FF;
    --bg-mid:#edf0f2;
    --bg-outer:#72a0c5;
    --foam:#16283a;
    --muted:#5f7a8f;
    --cyan:#3b71b0;
    --warm:#b8863f;
    --line: rgba(59,113,176,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    scroll-behavior:smooth;
    overflow-x:hidden;
    width:100%;
  }
  body{
    background: var(--bg-deep);
    color:var(--foam);
    min-height:100vh;
    overflow-x:hidden;
    width:100%;
  }

  /* ---------- HERO ---------- */
  .hero{
  /* 原本: min-height:100vh; min-height:100svh; */
    padding: 6vh 6vw 2rem; /* 👈 底部 padding 改成小一點的 2rem */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    }
  .hero::before{
    content:'';
    position:absolute;
    top:-5%; left:50%;
    transform:translateX(-50%);
    width:520px; height:520px;
    max-width:100vw;
    background: radial-gradient(circle, var(--bg-mid) 0%, rgba(235,240,244,0) 70%);
    pointer-events:none;
    z-index:0;
  }
  .hero > *{ position:relative; z-index:1; }
  .freq{
    font-size:0.75rem;
    letter-spacing:0.35em;
    color:var(--cyan);
    opacity:0.75;
    margin-bottom:2rem;
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.4;}
    50%{opacity:0.9;}
  }
  .title{
    font-weight:300;
    font-size:clamp(1.6rem, 4.2vw, 2.4rem);
    letter-spacing:0.08em;
    color:var(--foam);
    margin-bottom:0.9rem;
  }
  .artist{
    font-weight:300;
    font-size:0.95rem;
    letter-spacing:0.25em;
    color:var(--muted);
    margin-bottom:1.1rem;
  }
  .credits{
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--muted);
    opacity:0.6;
    display:flex;
    gap:1.4rem;
    margin-bottom:4rem;
  }

  /* ---------- SONAR / DISC ---------- */
  .sonar-wrap{
    position:relative;
    width:132px; height:132px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:2.6rem;
  }
  .ring{
    position:absolute;
    width:98px; height:98px;
    border:1px solid var(--cyan);
    border-radius:50%;
    opacity:0;
    animation:ripple 3.6s ease-out infinite;
    will-change: transform, opacity;
  }
  .ring:nth-child(2){ animation-delay:1.8s; }
  @keyframes ripple{
    0%{ transform:scale(1); opacity:0.45; }
    100%{ transform:scale(2.15); opacity:0; }
  }
  .disc{
    position:relative;
    z-index:2;
    width:98px; height:98px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(59,113,176,0.18),
      0 10px 24px -12px rgba(22,40,58,0.32);
  }
  .disc img{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    animation:spin 7s linear infinite;
    animation-play-state:paused;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .play-btn-mini{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    background:transparent;
    border:1px solid var(--cyan);
    color:var(--cyan);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .3s, color .3s;
  }
  .play-btn-mini:hover{ background:var(--cyan); color:var(--bg-deep); }
  .play-btn-mini svg{ width:10px; height:10px; }

  .transport{
    display:flex; align-items:center; gap:0.7rem;
    width:min(360px, 80vw);
    font-size:0.7rem;
    color:var(--muted);
  }
  .bar{
    flex:1; height:1px; background:var(--line);
    position:relative; cursor:pointer;
    touch-action:none;
  }
  .bar::before{
    /* 看不見,只是把可以點/拖拉的範圍往上下各擴大一點,手機上比較好按 */
    content:'';
    position:absolute;
    left:0; right:0; top:-12px; bottom:-12px;
  }
  .bar-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--cyan); width:0%;
    pointer-events:none;
  }
  .bar-thumb{
    position:absolute; top:50%; left:0%;
    width:10px; height:10px;
    background:var(--cyan);
    border-radius:50%;
    transform:translate(-50%, -50%);
    box-shadow:0 0 0 4px var(--bg-mid);
    pointer-events:none;
  }

  .lyrics-toggle{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:0.75rem;
    letter-spacing:0.25em;
    padding:0.65rem 1.6rem;
    border-radius:999px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
    margin-top:1.8rem;
    transition:background .3s, color .3s, border-color .3s;
  }
  .lyrics-toggle:hover{
    background:var(--line);
    color:var(--foam);
  }
  .lyrics-toggle-arrow{
    display:inline-block;
    transition:transform .35s ease;
    font-size:0.7em;
  }
  .lyrics-toggle.open .lyrics-toggle-arrow{
    transform:rotate(180deg);
  }

  /* ---------- LYRICS ---------- */
  .lyrics-section{
    max-width:640px;
    margin:0 auto;
    max-height:0;
    overflow:hidden;
    transition:max-height .5s ease;
  }
  .lyrics-inner{
    padding:2rem 8vw 6vh;
    display:flex;
    gap:2.4rem;
    position:relative;
  }
  .depth-gauge{
    position:relative;
    font-size:0.62rem;
    color:var(--muted);
    user-select:none;
    min-width:2.6rem;
  }
  .depth-gauge span{
    position:absolute;
    right:0;
    opacity:0.5;
    white-space:nowrap;
    line-height:1;
  }
  .lyrics{
    display:flex;
    flex-direction:column;
    gap:2.4rem;
    font-weight:300;
    font-size:0.9rem;
  }
  .stanza{
    display:flex;
    flex-direction:column;
  }
  .stanza p{
    color:var(--foam);
    opacity:0.82;
    line-height:1.45;
    margin:0.15rem 0;
  }

  footer{
    text-align:center;
    padding-bottom:8vh;
    font-size:0.62rem;
    letter-spacing:0.3em;
    color:var(--muted);
    opacity:0.45;
  }

  ::selection{ background:var(--cyan); color:var(--bg-deep); }

  @media (prefers-reduced-motion: reduce){
    .ring, .freq, .disc img{ animation:none; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="freq">52 HZ</div>
  <h1 class="title">潮聲未寄</h1>
  <div class="credits">
    <span>曲 · 紀遇</span>
    <span>詞 · 紀遇</span>
    <span>製作人 · 凌遠</span>
  </div>

  <div class="sonar-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="disc" id="disc">
      <img id="discImg" src="disc-spin.png" alt="潮聲未寄 唱片">
    </div>
  </div>

  <div class="transport">
    <button class="play-btn-mini" id="playBtn" aria-label="播放">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <span id="curTime">0:00</span>
    <div class="bar" id="seekBar"><div class="bar-fill" id="barFill"></div><div class="bar-thumb" id="barThumb"></div></div>
    <span id="durTime">0:00</span>
  </div>

  <button class="lyrics-toggle" id="lyricsToggle">
    <span id="lyricsToggleText">歌詞</span>
    <span class="lyrics-toggle-arrow" id="lyricsToggleArrow">▾</span>
  </button>
</section>

<section class="lyrics-section" id="lyricsSection">
  <div class="lyrics-inner" id="lyricsInner">
    <div class="depth-gauge" id="depthGauge"></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
</section>
<footer>
  <p style="margin-bottom: 0.4rem; letter-spacing: 0.3em;">NEVER HEARD, ALWAYS SENT</p>
  <p style="opacity: 0.7; letter-spacing: 0.15em;">© 2026 AETERNA Entertainment</p>
</footer>

<audio id="audio" src="song.mp3" preload="metadata"></audio>

<script>
/* ============================================================
   使用說明:
   time 是這句歌詞開始的秒數,目前是依歌曲長度(7:01)和一般
   主歌/副歌節奏抓的「大概位置」,不是逐句聽出來的精確時間。
   建議之後邊聽邊微調 time 的數字,抓到準確的進歌詞時機。
   ============================================================ */

/* ============================================================
   歌詞就照順序放,不會跟播放進度連動,單純靜態呈現。
   每個子陣列是一個段落(stanza),段落內行距會比較緊,
   段落之間留比較大的空白。
   ============================================================ */

const lyricsData = [
  // [Intro]
  [
    "微光落進杯沿 潮聲很輕",
    "夜色漫過指尖 寂靜無聲"
  ],
  // [Verse 1]
  [
    "霧把舊街 推向海岸",
    "燈在雨裡 慢慢搖晃",
    "未寄的信 沉入紙箱",
    "風替沉默 折回原樣"
  ],
  // [Pre-Chorus]
  [
    "若候鳥 忘了回音",
    "月色也 學會安靜"
  ],
  // [Chorus]
  [
    "那片海 仍替星辰留白",
    "把沒說完的話 藏進塵埃",
    "若有一盞燈 曾為夜醒來",
    "怎麼天亮後 只剩空白"
  ],
  // [Verse 2]
  [
    "窗邊的花 錯過了霜",
    "舊唱片轉著 微弱月光",
    "一張車票 失去了遠方",
    "夢在抽屜裡 停止生長"
  ],
  [
    "那片海 仍替星辰留白",
    "把沒說完的話 藏進塵埃",
    "若有一盞燈 曾為夜醒來",
    "怎麼天亮後 只剩空白"
  ],
  // [Bridge]
  [
    "若雪落回 未關的門",
    "是否能蓋住淺淺裂痕",
    "讓餘溫 不必承認"
  ],
  // [Outro]
  [
    "潮聲退回無人的岸",
    "一顆星 亮得太晚"
  ]
];


const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const seekBar = document.getElementById('seekBar');
const barFill = document.getElementById('barFill');
const barThumb = document.getElementById('barThumb');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const lyricsEl = document.getElementById('lyrics');
const depthGaugeEl = document.getElementById('depthGauge');

function fmt(s){
  if(!isFinite(s)) return "0:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// 建立歌詞 DOM(依段落分組)
lyricsData.forEach((stanza) => {
  const stanzaEl = document.createElement('div');
  stanzaEl.className = 'stanza';
  stanza.forEach((text) => {
    const p = document.createElement('p');
    p.textContent = text;
    stanzaEl.appendChild(p);
  });
  lyricsEl.appendChild(stanzaEl);
});

// 深度刻度(裝飾用,呼應「深海」意象):
// 依每個 stanza 實際的垂直位置換算深度,而不是靠第幾段硬編號,
// 這樣段落間距的視覺高度才會跟深度數字的差距成比例。
function layoutDepthGauge(){
  depthGaugeEl.innerHTML = '';
  const stanzaEls = document.querySelectorAll('.stanza');
  const pxPerMeter = 2.4; // 可依视觉效果微调，数字越小深度增加越快
  stanzaEls.forEach((stanzaEl) => {
    const depth = document.createElement('span');
    const meters = Math.round((stanzaEl.offsetTop / pxPerMeter) / 10) * 10;
    depth.textContent = meters + 'm';
    depth.style.top = stanzaEl.offsetTop + 'px';
    depthGaugeEl.appendChild(depth);
  });
}
layoutDepthGauge();
window.addEventListener('resize', layoutDepthGauge);
window.addEventListener('load', layoutDepthGauge);

// 歌詞展開/收合
const lyricsToggle = document.getElementById('lyricsToggle');
const lyricsSection = document.getElementById('lyricsSection');
const lyricsInner = document.getElementById('lyricsInner');
let lyricsOpen = false;

// 修正後的程式碼（加入自動平滑滑動）
lyricsToggle.addEventListener('click', () => {
  lyricsOpen = !lyricsOpen;
  lyricsToggle.classList.toggle('open', lyricsOpen);

  if(lyricsOpen){
    layoutDepthGauge();
    lyricsSection.style.maxHeight = lyricsInner.scrollHeight + 'px';
    
    // 🌟 算好精確位置再滑過去，完全不會晃動！
    setTimeout(() => {
      const targetPosition = lyricsSection.getBoundingClientRect().top + window.pageYOffset;
      window.scrollTo({
        top: targetPosition,
        behavior: 'smooth'
      });
    }, 200); // 稍微給一點點時間讓動畫先拉開
  } else {
    lyricsSection.style.maxHeight = '0px';
  }
});

window.addEventListener('resize', () => {
  if(lyricsOpen) lyricsSection.style.maxHeight = lyricsInner.scrollHeight + 'px';
});

playBtn.addEventListener('click', () => {
  if(audio.paused){
    audio.play().catch(()=>{ /* 尚未放入音檔時避免報錯中斷 */ });
  } else {
    audio.pause();
  }
});

const discImg = document.getElementById('discImg');

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
  discImg.style.animationPlayState = 'running';
});
audio.addEventListener('pause', () => {
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  discImg.style.animationPlayState = 'paused';
});

audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  curTimeEl.textContent = fmt(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  barFill.style.width = pct + '%';
  barThumb.style.left = pct + '%';
});

function seekRatioFromEvent(e){
  const rect = seekBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  return Math.min(1, Math.max(0, ratio));
}

let isSeeking = false;

seekBar.addEventListener('pointerdown', (e) => {
  isSeeking = true;
  seekBar.setPointerCapture(e.pointerId);
  e.preventDefault();
  const ratio = seekRatioFromEvent(e);
  if(audio.duration) audio.currentTime = ratio * audio.duration;
});

seekBar.addEventListener('pointermove', (e) => {
  if(!isSeeking) return;
  e.preventDefault();
  const ratio = seekRatioFromEvent(e);
  if(audio.duration) audio.currentTime = ratio * audio.duration;
});

seekBar.addEventListener('pointerup', () => { isSeeking = false; });
seekBar.addEventListener('pointercancel', () => { isSeeking = false; });

// 保險機制:部分手機瀏覽器只靠 touch-action 擋不住捲動,
// 拖拉進行中直接攔截 touchmove。
document.addEventListener('touchmove', (e) => {
  if(isSeeking) e.preventDefault();
}, { passive:false });
</script>

</body>
</html>
